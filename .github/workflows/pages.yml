# SPDX-License-Identifier: Apache-2.0
# Build the demo + docs from committed fixtures and publish to GitHub Pages.
# Repo is named sdex-orderbook, so Pages serves a project page: app at /sdex-orderbook/, docs at /sdex-orderbook/docs/.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/build-demo.sh
        env:
          # Project page: served at /sdex-orderbook/, so the docs base needs the repo prefix.
          SDX_DOCS_BASE: /sdex-orderbook/docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo-dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
