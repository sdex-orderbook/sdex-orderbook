# /etc/nginx/conf.d/sdx.conf. Replace api.example.org, then: certbot --nginx -d api.example.org
# Rate limit + timeouts stand in for the per-client limit and /paths deadline sdx lacks (SDX-029).
limit_req_zone $binary_remote_addr zone=sdx:10m rate=5r/s;

server {
    listen 80;
    server_name api.example.org;

    location / {
        limit_req zone=sdx burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
