# Render blueprint for the live read-only `sdx serve`. Verify plan names and prices in the
# Render dashboard first: bootstrap peaked at ~1.8 GB RSS, so use a plan with >= 4 GB RAM.
services:
  - type: web
    name: sdx-serve
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: pro
    autoDeploy: false
    disk:
      name: sdx-state
      mountPath: /var/lib/sdx
      sizeGB: 40
