[workspace]
resolver = "2"
members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
rust-version = "1.91"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
# =28.0.0 decodes LedgerCloseMeta V0-V2 and TransactionMeta V0-V4 (protocols up to 29, mainnet on 2026-11-03).
stellar-xdr = { version = "=28.0.0", default-features = false, features = ["std"] }
stellar-strkey = "=0.0.13"
zstd = { version = "=0.13.4", default-features = false }
flate2 = "1.1"
ureq = { version = "2", default-features = false, features = ["tls"] }
ethnum = "1.5"

sdx-core = { package = "sik-sdex-orderbook-core", path = "crates/core" }

[profile.release]
overflow-checks = true
debug = 1
[profile.dev.package.stellar-xdr]
opt-level = 1
